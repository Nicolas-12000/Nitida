components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Sesión JDBC de Spring Security (8 h de inactividad).
    csrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Valor de la cookie `XSRF-TOKEN` en mutaciones.
    workshopId:
      type: apiKey
      in: header
      name: X-Workshop-Id
      description: UUID del taller activo; debe ser una membresía del usuario.

  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          description: Mensaje en español (puede cambiar; preferir traducir `code` en el cliente).
        status:
          type: integer
        code:
          type: string
          description: Código estable en inglés (ver catálogo en docs/api.md).
        traceId:
          type: string
          description: Solo en errores 500 para soporte.

    Uuid:
      type: string
      format: uuid

    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 120 }

    UserIdResponse:
      type: object
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    WorkshopRole:
      type: object
      properties:
        workshopId: { $ref: '#/components/schemas/Uuid' }
        role:
          type: string
          enum: [WORKSHOP_OWNER, MECHANIC, FRONT_DESK]

    MeResponse:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string }
        displayName: { type: string }
        platformAdmin: { type: boolean }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/WorkshopRole' }

    RegisterWorkshopRequest:
      type: object
      required: [name, documentNumber, address, municipality, phone]
      properties:
        name: { type: string }
        documentNumber: { type: string }
        address: { type: string }
        municipality: { type: string }
        phone: { type: string }
        facadePhotoId: { $ref: '#/components/schemas/Uuid' }

    WorkshopIdResponse:
      type: object
      properties:
        workshopId: { $ref: '#/components/schemas/Uuid' }

    WorkshopSettingsRequest:
      type: object
      required: [intakeAlertHours, cashTolerance, stalledDays, version]
      properties:
        intakeAlertHours: { type: integer, minimum: 1, maximum: 168 }
        cashTolerance: { type: integer, format: int64, minimum: 0 }
        stalledDays: { type: integer, minimum: 1, maximum: 90 }
        version: { type: integer, format: int64 }

    InviteRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role:
          type: string
          enum: [MECHANIC, FRONT_DESK]

    InviteResponse:
      type: object
      properties:
        token:
          type: string
          description: Token de invitación; se muestra una sola vez.

    AdminStatusRequest:
      type: object
      required: [status, evidence]
      properties:
        status:
          type: string
          enum: [VERIFIED, SUSPENDED, PENDING_VERIFICATION]
        evidence: { type: string }

    IntakeRegisterRequest:
      type: object
      required: [mileage, odometerPhotoId, motorcyclePhotoId]
      properties:
        plate: { type: string }
        vin: { type: string }
        brand: { type: string }
        line: { type: string }
        modelYear: { type: integer }
        displacementCc: { type: integer }
        mileage: { type: integer, minimum: 0, maximum: 999999 }
        odometerPhotoId: { $ref: '#/components/schemas/Uuid' }
        motorcyclePhotoId: { $ref: '#/components/schemas/Uuid' }

    ChangePlateRequest:
      type: object
      required: [plate]
      properties:
        plate:
          type: string
          description: Placa actual `ABC12D` o antigua `ABC12`; se normaliza (mayúsculas, sin espacios ni guiones).
          example: ABC12D

    DiscardRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [CONSULTATION_ONLY, CUSTOMER_WITHDREW, ENTRY_ERROR]

    CreateCustomerRequest:
      type: object
      required: [fullName, phone, consentAccepted, policyVersion, consentChannel]
      properties:
        fullName: { type: string }
        phone: { type: string }
        nationalId: { type: string }
        email: { type: string, format: email }
        consentAccepted: { type: boolean }
        policyVersion: { type: string }
        consentChannel:
          type: string
          enum: [IN_PERSON, PHONE, EMAIL, OTHER]

    UpdateCustomerRequest:
      type: object
      required: [fullName, phone, nationalId, email]
      properties:
        fullName: { type: string }
        phone: { type: string }
        nationalId: { type: string }
        email: { type: string, format: email }

    CustomerResponse:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        fullName: { type: string }
        phone: { type: string }
        nationalId: { type: string }
        email: { type: string }

    OpenOrderRequest:
      type: object
      required: [intakeId, diagnosis]
      properties:
        intakeId: { $ref: '#/components/schemas/Uuid' }
        customerId: { $ref: '#/components/schemas/Uuid' }
        diagnosis: { type: string, minLength: 10, maxLength: 2000 }
        mechanicId: { $ref: '#/components/schemas/Uuid' }
        warrantyOfOrderId: { $ref: '#/components/schemas/Uuid' }

    JobInput:
      type: object
      required: [type, description]
      properties:
        type:
          type: string
          enum: [OIL_CHANGE, DRIVE_CHAIN_KIT, BRAKES, SUSPENSION, ELECTRICAL, ENGINE, TIRES, TUNE_UP, OTHER]
        description: { type: string }

    EditOrderRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, format: int64 }
        diagnosis: { type: string }
        laborCost: { type: integer, format: int64 }
        warrantyDays: { type: integer }
        warrantyKm: { type: integer }
        jobs:
          type: array
          items: { $ref: '#/components/schemas/JobInput' }

    TransitionRequest:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, COMPLETED, CANCELLED]
        reason: { type: string }
        version: { type: integer, format: int64 }

    PartRequest:
      type: object
      required: [name, brand, condition, quantity, unitPrice]
      properties:
        name: { type: string }
        reference: { type: string }
        brand: { type: string }
        condition:
          type: string
          enum: [OEM, AFTERMARKET, USED]
        quantity: { type: integer, minimum: 1, maximum: 999 }
        unitPrice: { type: integer, format: int64 }
        productCode: { type: string }
        replacementPhotoId: { $ref: '#/components/schemas/Uuid' }

    SerialRequest:
      type: object
      required: [serial]
      properties:
        serial: { type: string }
        reactivationReason: { type: string }

    SerialResult:
      type: object
      properties:
        accepted: { type: boolean }
        evidenceLevel: { type: string }
        message: { type: string }

    AuthenticityRequest:
      type: object
      required: [photoId, method]
      properties:
        photoId: { $ref: '#/components/schemas/Uuid' }
        method: { type: string }

    PhotoRequest:
      type: object
      required: [fileId, moment]
      properties:
        fileId: { $ref: '#/components/schemas/Uuid' }
        moment:
          type: string
          enum: [BEFORE, AFTER]

    PaymentRequest:
      type: object
      required: [method, amount]
      properties:
        method:
          type: string
          enum: [CASH, TRANSFER, CARD, STORE_CREDIT]
        amount: { type: integer, format: int64 }

    VoidPaymentRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    DeliveryRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, format: int64 }

    DeliveryResponse:
      type: object
      properties:
        orderId: { $ref: '#/components/schemas/Uuid' }
        total: { type: integer, format: int64 }
        claimCode:
          type: string
          description: Código de 8 caracteres; una sola vez (Cache-Control no-store).
        claimCodeExpiresAt: { type: string, format: date-time }

    ProposeProductRequest:
      type: object
      required: [code, name, brand]
      properties:
        code: { type: string }
        name: { type: string }
        brand: { type: string }
        reference: { type: string }

    RetireSerialRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 200 }

    FileIdResponse:
      type: object
      properties:
        fileId: { $ref: '#/components/schemas/Uuid' }

    AmendmentRequest:
      type: object
      required: [amendsSeq, reason]
      properties:
        amendsSeq: { type: integer, format: int64 }
        reason: { type: string }
        diagnosis: { type: string }
        mileage: { type: integer }

    OdometerChangeRequest:
      type: object
      required: [mileage, reason, photoId]
      properties:
        mileage: { type: integer }
        reason: { type: string }
        photoId: { $ref: '#/components/schemas/Uuid' }

    LinkRequest:
      type: object
      properties:
        days: { type: integer, minimum: 1, maximum: 365, default: 30 }

    PublicLinkResponse:
      type: object
      properties:
        linkId: { $ref: '#/components/schemas/Uuid' }
        token:
          type: string
          description: Se devuelve una sola vez.
        expiresAt: { type: string, format: date-time }

    CloseCashCountRequest:
      type: object
      required: [counted]
      properties:
        counted: { type: integer, format: int64 }

    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500 }

    CommentRequest:
      type: object
      required: [comment]
      properties:
        comment: { type: string, minLength: 5, maxLength: 500 }

    ClaimRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 8

    TransferStartResponse:
      type: object
      properties:
        code: { type: string }
        expiresAt: { type: string, format: date-time }

  parameters:
    Limit:
      name: limit
      in: query
      description: Tamaño de página, de 1 a 100 (50 por defecto). Otro valor → `422 INVALID_LIMIT`.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: |
        Cursor opaco que devolvió la página anterior en `X-Next-Cursor`. Sin cursor, primera página.
        Un cursor mal formado → `400 INVALID_CURSOR`. No se interpreta ni se reutiliza entre talleres.
      schema: { type: string }

  headers:
    NextCursor:
      description: Cursor de la página siguiente; ausente en la última página
      schema: { type: string }

  responses:
    BadRequest:
      description: Parámetro o encabezado inválido (`WORKSHOP_REQUIRED`, `INVALID_WORKSHOP_ID`, …)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unauthenticated:
      description: Sin sesión (`UNAUTHENTICATED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Forbidden:
      description: Rol sin permiso o CSRF ausente (`FORBIDDEN`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: No existe o es de otro taller (`NOT_FOUND`, …)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: Conflicto de versión o estado (`VERSION_CONFLICT`, …)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unprocessable:
      description: Regla de negocio o validación (`422` + `code`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    WorkshopSuspended:
      description: Taller suspendido (`WORKSHOP_SUSPENDED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    RateLimited:
      description: Demasiados intentos (`RATE_LIMITED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    InternalError:
      description: Error inesperado (`INTERNAL_ERROR` + `traceId`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
