openapi: 3.0.3
info:
  title: Nítida API
  version: 1.0.0
  description: |
    API HTTP del backend de negocio de Nítida (talleres de motos, historial firmado Ed25519, caja y portal del propietario).

    ## Convenciones

    - Base `/api/v1`, JSON UTF-8. El frontend llama al **mismo origen** (Next reescribe `/api/*`). Sin CORS.
    - **Sesión:** cookie `SESSION` (`HttpOnly`, `SameSite=Lax`, `Secure` salvo HTTP local). Se crea con `POST /auth/login`.
    - **CSRF:** cookie `XSRF-TOKEN` (legible por JS); en todo `POST`/`PATCH`/`PUT`/`DELETE` enviar `X-XSRF-TOKEN` con el mismo valor.
    - **Taller activo:** rutas de taller exigen `X-Workshop-Id`. Recurso de otro taller → `404` (no `403`).
    - **Errores:** RFC 9457 `application/problem+json` con `code` estable en inglés (ver `ProblemDetails`).
    - **Dinero:** pesos enteros (`long`). **Kilometraje:** 0–999.999.
    - **Concurrencia:** enviar `version` al editar; choque → `409 VERSION_CONFLICT`.

    Fuente complementaria: `docs/api.md`. Las rutas deben coincidir con `ApiContractTest` y `OpenApiContractTest`.
  termsOfService: https://github.com/nitida/nitida
  contact:
    name: Equipo Nítida

servers:
  - url: http://localhost:8080
    description: Desarrollo local (docker compose o `./gradlew bootRun`)
  - url: /
    description: Mismo origen detrás del proxy Next.js

tags:
  - name: auth
    description: Registro, login, sesión y membresías
  - name: workshops
    description: Talleres, invitaciones, administración de plataforma
  - name: intake
    description: Recepción de motos
  - name: customers
    description: Clientes y datos personales (Ley 1581)
  - name: motorcycles
    description: Consulta de motos
  - name: orders
    description: Órdenes de trabajo, repuestos, pagos y entrega
  - name: catalog
    description: Catálogo de productos y seriales globales
  - name: files
    description: Fotos y evidencias
  - name: history
    description: Historial firmado, enmiendas, odómetro y links
  - name: cashdesk
    description: Cuadre de caja y alertas F1–F6 (solo dueño)
  - name: owner
    description: Portal del propietario de la moto

