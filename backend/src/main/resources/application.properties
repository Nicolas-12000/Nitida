spring.application.name=nitida

# OpenAPI + Swagger UI (dev only). OwaspSecurityTest expects these closed in tests.
nitida.openapi.enabled=false
springdoc.api-docs.enabled=${nitida.openapi.enabled}
springdoc.swagger-ui.enabled=${nitida.openapi.enabled}
scalar.enabled=false

# Database: schema is owned by Flyway; Hibernate only validates it.
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Sessions (server side, JDBC). Table is created by Flyway.
spring.session.jdbc.initialize-schema=never
spring.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${NITIDA_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

# Uploads (RN files: max 8 MB)
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

# Actuator: only health is public (A02)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Signing keys are encrypted with a KEK that never lives in the repository.
nitida.signing.kek=${NITIDA_SIGNING_KEK}
nitida.signing.kek-version=1
nitida.files.root=${NITIDA_FILES_ROOT:./data/files}
nitida.privacy.policy-version=2026-1

# Behind the Next proxy the client address comes from X-Forwarded-For, honored only from internal proxies
# (loopback and private ranges, Tomcat's default): per-IP limits would otherwise see the proxy as one client.
server.forward-headers-strategy=native

# Single instance: deliver whatever was left outstanding when the app stopped. With several instances turn this off
# and keep only the scheduled resubmission (EventResubmission).
spring.modulith.events.republish-outstanding-events-on-restart=true
