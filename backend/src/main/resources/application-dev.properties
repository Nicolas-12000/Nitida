# Local exploration: Swagger UI + OpenAPI JSON/YAML. Never enable in production.
nitida.openapi.enabled=true
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=list
scalar.enabled=false
# Local exploration only: a platform admin gets admin privileges without enrolling TOTP (spec section 10 requires it in production).
nitida.admin.totp-required=false
