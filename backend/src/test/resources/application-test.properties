# Tests run without Docker: H2 in PostgreSQL mode, schema built by the real Flyway migrations.
spring.docker.compose.enabled=false

spring.datasource.url=jdbc:h2:mem:nitida;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Throwaway key for tests only (not a secret): 32 zero bytes in base64.
nitida.signing.kek=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
nitida.files.root=build/test-files
server.servlet.session.cookie.secure=false
nitida.login.ip-limit=10000
nitida.openapi.enabled=false
nitida.register.ip-limit=100000
nitida.rls.enabled=false
spring.flyway.locations=classpath:db/migration
nitida.mail.mode=capture
nitida.password-reset.ip-limit=100000
