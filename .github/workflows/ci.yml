name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push cancels the previous run of the same branch, but never a run on main (every merge keeps its own result).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Decides what changed so a frontend-only PR does not pay for PIT and the image, and the other way around.
  # Security scans (secrets, SAST, dependencies) always run: they are cheap and must never be skipped.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then base="origin/$BASE_REF"; else base="$BEFORE"; fi
          # A new branch or a force-push has no usable "before" commit: treat everything as changed.
          if git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            files="$(git diff --name-only "$base"...HEAD)"
          else
            files=ALL
          fi
          changed() { [ "$files" = ALL ] || printf '%s\n' "$files" | grep -qE "$1"; }
          if changed '^(backend/|sonar-project\.properties$|docker-compose\.yml$|\.zap/|\.github/workflows/ci\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f frontend/package.json ] && changed '^(frontend/|\.github/workflows/ci\.yml$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend (build, tests, architecture, coverage, Sonar)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Exposed at job level so the Sonar step's `if` can see it (a step's own env is not visible to its own `if`).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ env.SONAR_TOKEN != '' && 0 || 1 }} # only Sonar needs history (blame, new-code detection)
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # 'build' runs unit + integration tests, ApplicationModules.verify(), ArchUnit and the JaCoCo coverage rule.
      # Dependency verification (gradle/verification-metadata.xml) is enforced by default.
      - name: Build, test and verify coverage
        run: ./gradlew build
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-reports
          path: |
            backend/build/reports/tests
            backend/build/reports/jacoco
            backend/build/test-results
          retention-days: 14
      - name: SonarQube analysis and Quality Gate
        # Needs the SONAR_TOKEN secret and SONAR_HOST_URL variable; skipped (not failed) on forks and when not configured.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.qualitygate.wait=true

  mutation:
    name: Mutation testing (PIT)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: PIT mutation score gate
        run: ./gradlew pitest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pit-report
          path: backend/build/reports/pitest
          retention-days: 14

  frontend:
    name: Frontend (types, lint)
    needs: changes
    # hashFiles() is not available in a job-level `if`; the "changes" job already checked that frontend/package.json exists.
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # LayoutProps/PageProps are global types Next generates; without typegen tsc cannot see them.
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependencies (Trivy filesystem)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy filesystem scan (fails on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln # gitleaks already looks for secrets
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: frontend/node_modules

  # The Dockerfile builds the jar itself (bootJar -x test), so the image does not wait for the test job: both run in parallel.
  image:
    name: Container image (build, Trivy, DAST)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job level, not step level: every `docker compose` call (start, logs on failure) interpolates these.
    env:
      POSTGRES_PASSWORD: ci-only-password
      NITIDA_APP_DB_PASSWORD: ci-only-app-password
      NITIDA_SIGNING_KEK: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NITIDA_COOKIE_SECURE: 'false'
      BACKEND_IMAGE: nitida-backend:ci
      # Same compose file as local, but without the dev profile: Swagger stays closed during DAST.
      SPRING_PROFILES_ACTIVE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          tags: nitida-backend:ci
          # The dependency layer (see Dockerfile) is reused until build.gradle.kts or the verification file changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nitida-backend:ci
          scanners: vuln # gitleaks already looks for secrets; the secret scanner is what made this step slow
          severity: CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-image.json
          exit-code: '0' # the next step decides, so every finding shows up as a readable annotation
      - name: Fail on fixable CRITICAL vulnerabilities (one annotation each)
        run: |
          python3 - <<'PY'
          import json, sys
          found = [v for r in json.load(open("trivy-image.json")).get("Results") or [] for v in r.get("Vulnerabilities") or []]
          clean = lambda t: " ".join(str(t or "").split()).replace("%", "percent")
          for v in found:
              print(f"::error title={v['VulnerabilityID']} in {v['PkgName']} {v['InstalledVersion']}::fixed in {v.get('FixedVersion') or '?'}: {clean(v.get('Title'))}")
          sys.exit(1 if found else 0)
          PY
      - name: SBOM (CycloneDX) of the shipped image
        if: github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nitida-backend:ci
          scanners: vuln
          format: cyclonedx
          output: sbom.cdx.json
      - name: Upload SBOM
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
      - name: Start the stack for DAST
        id: stack
        run: |
          docker compose up -d postgres backend
          # docker-proxy accepts :8080 as soon as the container starts, then resets the
          # connection until the JVM listens. That is curl exit 56, and --retry-connrefused
          # only retries exit 7, so the probe has to loop on its own.
          for _ in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health; then
              exit 0
            fi
            sleep 3
          done
          echo "backend did not become healthy on :8080" >&2
          exit 1
      - name: OWASP ZAP passive scan of the API
        # One request per OpenAPI operation, then the passive rules. No active attack:
        # that pass is several minutes and, without a session, mostly pokes 401s.
        run: |
          # ZAP's own proxy defaults to 8080, which is the backend. The plan still calls the API there.
          docker run --rm --network host \
            -v "${GITHUB_WORKSPACE}:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -silent -port 8090 -autorun /zap/wrk/.zap/plan.yaml
      - name: Stack logs on failure
        # Only when the stack was started: a failed scan before it has no containers to show.
        if: failure() && steps.stack.outcome != 'skipped'
        run: docker compose logs --no-color --tail=200 backend

  # Parallel with the test and image jobs, so this does not add its minutes on top of them.
  codeql-backend:
    name: CodeQL (Java)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: manual
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build for analysis
        working-directory: backend
        run: ./gradlew compileJava --no-daemon
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:java-kotlin

  codeql-frontend:
    name: CodeQL (TypeScript)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript

  # The one check to require in branch protection: green when every job that had to run passed (skipped is fine).
  ci-ok:
    name: CI passed
    if: always()
    needs: [changes, backend, mutation, frontend, secrets, dependencies, image, codeql-backend, codeql-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
