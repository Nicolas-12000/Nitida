name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push cancels the previous run of the same branch, but never a run on main (every merge keeps its own result).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Decides what changed so a frontend-only PR does not pay for PIT and the image, and the other way around.
  # Security scans (secrets, SAST, dependencies) always run: they are cheap and must never be skipped.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then base="origin/$BASE_REF"; else base="$BEFORE"; fi
          # A new branch or a force-push has no usable "before" commit: treat everything as changed.
          if git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            files="$(git diff --name-only "$base"...HEAD)"
          else
            files=ALL
          fi
          changed() { [ "$files" = ALL ] || printf '%s\n' "$files" | grep -qE "$1"; }
          if changed '^(backend/|sonar-project\.properties$|docker-compose\.yml$|\.zap/|\.github/workflows/ci\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f frontend/package.json ] && changed '^(frontend/|\.github/workflows/ci\.yml$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend (build, tests, architecture, coverage, Sonar)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Exposed at job level so the Sonar step's `if` can see it (a step's own env is not visible to its own `if`).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Sonar needs history for blame / new-code detection
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # 'build' runs unit + integration tests, ApplicationModules.verify(), ArchUnit and the JaCoCo coverage rule.
      # Dependency verification (gradle/verification-metadata.xml) is enforced by default.
      - name: Build, test and verify coverage
        run: ./gradlew build
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-reports
          path: |
            backend/build/reports/tests
            backend/build/reports/jacoco
            backend/build/test-results
          retention-days: 14
      - name: SonarQube analysis and Quality Gate
        # Needs the SONAR_TOKEN secret and SONAR_HOST_URL variable; skipped (not failed) on forks and when not configured.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.qualitygate.wait=true

  mutation:
    name: Mutation testing (PIT)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: PIT mutation score gate
        run: ./gradlew pitest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pit-report
          path: backend/build/reports/pitest
          retention-days: 14

  frontend:
    name: Frontend (types, lint)
    needs: changes
    # hashFiles() is not available in a job-level `if`; the "changes" job already checked that frontend/package.json exists.
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable pnpm
        run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep (OSS rules, fails on findings)
        run: semgrep scan --config p/java --config p/owasp-top-ten --config p/secrets --error --metrics=off backend/src

  dependencies:
    name: Dependencies (Trivy filesystem + SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy filesystem scan (fails on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: frontend/node_modules
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          skip-dirs: frontend/node_modules
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  dependency-review:
    name: Dependency review (new vulnerable or restricted dependencies)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  # The Dockerfile builds the jar itself (bootJar -x test), so the image does not wait for the test job: both run in parallel.
  image:
    name: Container image (build, Trivy + Grype, DAST)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build backend image
        run: docker build -t nitida-backend:ci backend
      - name: Trivy image scan (fails on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nitida-backend:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Grype image scan (second opinion)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: nitida-backend:ci
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
      - name: Start the stack for DAST
        env:
          POSTGRES_PASSWORD: ci-only-password
          NITIDA_SIGNING_KEK: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          NITIDA_COOKIE_SECURE: 'false'
          BACKEND_IMAGE: nitida-backend:ci
        run: |
          docker compose up -d postgres backend
          curl --fail --silent --retry 40 --retry-delay 3 --retry-connrefused http://localhost:8080/actuator/health
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8080/actuator/health
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 backend

  # The one check to require in branch protection: green when every job that had to run passed (skipped is fine).
  ci-ok:
    name: CI passed
    if: always()
    needs: [changes, backend, mutation, frontend, secrets, sast, dependencies, dependency-review, image]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
